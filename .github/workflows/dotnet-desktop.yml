name: Build and test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore bstrings.sln --verbosity minimal

      - name: Build
        run: dotnet build bstrings.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test bstrings.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --verbosity normal

      - name: Publish Windows x64 single-file build
        run: >
          dotnet publish bstrings/bstrings.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          --framework net9.0
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package release
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "bstrings-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $packagePath -Force
          Get-FileHash -Algorithm SHA256 $packagePath

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: bstrings-win-x64
          path: bstrings-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: bstrings-win-x64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: bstrings-win-x64.zip
          generate_release_notes: true
