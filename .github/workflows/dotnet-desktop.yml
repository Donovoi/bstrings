name: Build and test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_offline:
        description: Run the hosted full-offline build and prepare its verified component cache
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test and enforce high-level decision records
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/decisions/tests/Test-DecisionRecords.ps1
          if (
            $env:GITHUB_EVENT_NAME -eq 'pull_request' -or
            ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/master')
          ) {
            ./tools/decisions/Test-DecisionRecords.ps1 `
              -BaseRevision $env:BASE_SHA `
              -HeadRevision $env:HEAD_SHA `
              -PullRequestBody $env:PR_BODY
          }

      - name: Require an exact project-version release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'bstrings/bstrings.csproj' -Raw
          $versions = @($project.SelectNodes('/Project/PropertyGroup/Version') | ForEach-Object {
            [string]$_.InnerText
          } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "Expected exactly one project Version, found $($versions.Count)."
          }
          $expectedTag = 'v' + $versions[0]
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match project version '$expectedTag'."
          }

      - name: Require a release version bump for code changes
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./tools/release/Assert-CodeVersion.ps1
          -BaseRevision $env:BASE_SHA
          -HeadRevision $env:HEAD_SHA

      - name: Test release policies
        shell: pwsh
        run: |
          ./tools/release/tests/Test-CodeVersionPolicy.ps1
          ./tools/release/tests/Test-HostedReleaseLane.ps1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/bstrings_core/Cargo.toml --check

      - name: Lint Rust engine
        run: cargo clippy --manifest-path native/bstrings_core/Cargo.toml --release --all-targets --locked -- -D warnings

      - name: Test Rust engine
        run: cargo test --manifest-path native/bstrings_core/Cargo.toml --release --locked

      - name: Build Rust engine
        run: cargo build --manifest-path native/bstrings_core/Cargo.toml --release --locked

      - name: Fetch complete locked Rust notice graph
        run: cargo fetch --manifest-path native/bstrings_core/Cargo.toml --locked

      - name: Verify Rust third-party notices
        shell: pwsh
        run: ./tools/licenses/Verify-RustThirdPartyNotices.ps1

      - name: Install Python test tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.14.14
          pyarrow==25.0.0
          shapely==2.1.2

      - name: Lint and compile Python tools
        shell: pwsh
        run: |
          python -m ruff check `
            --config tools/enrichment/pyproject.toml `
            tools/enrichment `
            tools/airgap
          if ($LASTEXITCODE -ne 0) {
            throw "Ruff failed with exit code $LASTEXITCODE."
          }

          python -m compileall -q -f tools/enrichment tools/airgap
          if ($LASTEXITCODE -ne 0) {
            throw "compileall failed with exit code $LASTEXITCODE."
          }

      - name: Test Python tools
        run: python -m unittest discover -s tools/enrichment/tests -v

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($script in Get-ChildItem tools, Scripts -Recurse -File -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              Write-Host "::error file=$($script.FullName)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            throw 'PowerShell syntax validation failed.'
          }

      - name: Test quality installer with Windows PowerShell 5.1
        shell: powershell
        run: .\Scripts\tests\Test-Install-BstringsQuality.ps1

      - name: Test quality installer with PowerShell 7
        shell: pwsh
        run: ./Scripts/tests/Test-Install-BstringsQuality.ps1

      - name: Test README installer bootstrap with Windows PowerShell 5.1
        shell: powershell
        run: .\Scripts\tests\Test-ReadmeBootstrap.ps1

      - name: Test README installer bootstrap with PowerShell 7
        shell: pwsh
        run: ./Scripts/tests/Test-ReadmeBootstrap.ps1

      - name: Test offline release evidence validation
        shell: pwsh
        run: ./tools/airgap/tests/Test-OfflineProfileReleaseEvidence.ps1

      - name: Test bundled Markdown-link validation
        shell: pwsh
        run: ./tools/airgap/tests/Test-MarkdownLinks.ps1

      - name: Test Magika cache-only fail-closed guard
        shell: pwsh
        run: ./tools/licenses/Test-MagikaCacheOnlyGuard.ps1

      - name: Restore
        run: dotnet restore bstrings.sln --runtime win-x64 --verbosity minimal

      - name: Stage and verify managed release notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $noticeSource = Join-Path $env:RUNNER_TEMP 'bstrings-release-notices'
          ./tools/licenses/Stage-ManagedThirdPartyNotices.ps1 `
            -DestinationDirectory $noticeSource `
            -DownloadCacheDirectory (Join-Path $env:RUNNER_TEMP 'bstrings-release-notice-cache')
          ./tools/licenses/Verify-ManagedThirdPartyNotices.ps1 `
            -NoticeSourceDirectory $noticeSource

      - name: Build
        run: dotnet build bstrings.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test bstrings.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --verbosity normal

      - name: Publish Windows x64 single-file build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $noticeSource = Join-Path $env:RUNNER_TEMP 'bstrings-release-notices'
          dotnet publish bstrings/bstrings.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/win-x64 `
            --framework net10.0 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:TreatWarningsAsErrors=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            "-p:ReleaseNoticeSourceDirectory=$noticeSource"

      - name: Verify published managed and runtime notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/licenses/Verify-ManagedThirdPartyNotices.ps1 `
            -NoticeSourceDirectory (Join-Path $env:RUNNER_TEMP 'bstrings-release-notices') `
            -PublishedDirectory publish/win-x64

      - name: Stage licensed Visual C++ runtime beside bstrings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staged = @(
            ./tools/airgap/Stage-VisualCppRuntime.ps1 `
              -DestinationDirectory publish/win-x64
          )
          if ($staged.Count -ne 1 -or @($staged[0].files).Count -ne 4) {
            throw 'Visual C++ runtime staging did not verify all four required DLL names and selected bytes.'
          }
          foreach ($runtimeFile in $staged[0].files) {
            $path = Join-Path 'publish/win-x64' ([string]$runtimeFile.name)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne [string]$runtimeFile.sha256) {
              throw "Published Visual C++ runtime hash mismatch: $path"
            }
          }

      - name: Validate complete offline component lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dryRunOutput = Join-Path $env:RUNNER_TEMP 'bstrings-offline-dry-run'
          ./tools/airgap/Build-CompleteOfflineBundle.ps1 `
            -PublishedBstringsDirectory publish/win-x64 `
            -OutputDirectory $dryRunOutput `
            -DryRun
          if (Test-Path -LiteralPath $dryRunOutput) {
            throw 'Offline bundle dry run unexpectedly created its output directory.'
          }

      - name: Smoke published integrated analysis offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'bstrings-published-smoke'
          $inputPath = Join-Path $smokeRoot 'spanish-evidence.txt'
          $resultsPath = Join-Path $smokeRoot 'results'
          [IO.Directory]::CreateDirectory($smokeRoot) | Out-Null
          [IO.File]::WriteAllText(
            $inputPath,
            'La clave pertenece a analyst@example.com y este mensaje contiene palabras escritas claramente en espanol para verificar la deteccion automatica.',
            [Text.UTF8Encoding]::new($false)
          )

          $env:HF_DATASETS_OFFLINE = '1'
          $env:HF_HUB_OFFLINE = '1'
          $env:TRANSFORMERS_OFFLINE = '1'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'

          $originalPath = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          try {
            $publishRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'publish/win-x64'))
            [Environment]::SetEnvironmentVariable(
              'PATH',
              "$publishRoot$([IO.Path]::PathSeparator)$(Join-Path $env:SystemRoot 'System32')",
              'Process'
            )
            & 'publish/win-x64/bstrings.exe' analyze `
              -f $inputPath `
              --translation detect-only `
              --language-detection accurate `
              --recover-executable-strings off `
              --processor cpu `
              --cpu-engine rust `
              --maximum-length 4096 `
              --translation-max-characters 512 `
              --lr email `
              -o $resultsPath
            if ($LASTEXITCODE -ne 0) {
              throw "Published bstrings analyze smoke failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            [Environment]::SetEnvironmentVariable('PATH', $originalPath, 'Process')
          }

          $run = Get-Content -LiteralPath (Join-Path $resultsPath 'run.json') -Raw |
            ConvertFrom-Json
          $summary = Get-Content -LiteralPath (Join-Path $resultsPath 'summary.json') -Raw |
            ConvertFrom-Json
          if ($run.status -ne 'complete' -or $summary.status -ne 'complete') {
            throw 'Published analysis did not produce complete run and summary records.'
          }
          if (
            $summary.translationCandidates -lt 1 -or
            $summary.translatedStrings -ne 0 -or
            $summary.regexMatches -lt 1
          ) {
            throw 'Published detect-only smoke did not assess non-English text and match its retained email.'
          }
          $markers = @(Get-ChildItem -LiteralPath $resultsPath -Recurse -Force | Where-Object {
            $_.Name -eq '.incomplete' -or $_.Name.EndsWith('.incomplete', [StringComparison]::Ordinal)
          })
          if ($markers.Count -ne 0) {
            throw "Published analysis left incomplete markers: $($markers.FullName -join ', ')"
          }
          $manifestPath = Join-Path $resultsPath $summary.inputIdentity.manifest
          $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (
            $manifestHash -ne $summary.inputIdentity.manifestSha256 -or
            $manifestHash -ne $run.input.manifestSha256
          ) {
            throw 'Published analysis manifest identity does not match run.json and summary.json.'
          }

      - name: Package release
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "bstrings-win-x64.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $packagePath -Force
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'bstrings-core-archive-verification'
          if (Test-Path -LiteralPath $verifyRoot) {
            throw "Core archive verification directory already exists: $verifyRoot"
          }
          [IO.Compression.ZipFile]::ExtractToDirectory($packagePath, $verifyRoot)
          ./tools/licenses/Verify-ManagedThirdPartyNotices.ps1 `
            -PublishedDirectory $verifyRoot
          ./tools/airgap/Verify-MarkdownLinks.ps1 `
            -BundleDirectory $verifyRoot
          Get-FileHash -Algorithm SHA256 $packagePath

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: bstrings-win-x64
          path: bstrings-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Restore exact default-branch offline component cache
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.full_offline)
        id: offline-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}\bstrings-offline\downloads
            ${{ runner.temp }}\bstrings-offline\ocr-downloads
          key: bstrings-offline-default-v1-${{ runner.os }}-${{ hashFiles('tools/airgap/offline-components.lock.json', 'tools/airgap/ocr-components.lock.json') }}

      - name: Build the complete highest-quality offline bundle
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.full_offline)
        shell: pwsh
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/airgap/Build-CompleteOfflineBundle.ps1 `
            -PublishedBstringsDirectory publish/win-x64 `
            -OutputDirectory publish/offline `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'bstrings-offline') `
            -TranslationProfile quality

      - name: Revalidate the warmed offline cache without network fallback
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.full_offline)
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $validationOutput = Join-Path $env:RUNNER_TEMP 'bstrings-offline-cache-validation-output'
          ./tools/airgap/Build-CompleteOfflineBundle.ps1 `
            -PublishedBstringsDirectory publish/win-x64 `
            -OutputDirectory $validationOutput `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'bstrings-offline') `
            -TranslationProfile quality `
            -ValidateOnly
          if (Test-Path -LiteralPath $validationOutput) {
            throw 'Cache-only offline validation unexpectedly created bundle output.'
          }

      - name: Save validated default-branch offline component cache
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          inputs.full_offline &&
          steps.offline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}\bstrings-offline\downloads
            ${{ runner.temp }}\bstrings-offline\ocr-downloads
          key: ${{ steps.offline-cache.outputs.cache-primary-key }}

      - name: Verify and split the offline release packs
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.full_offline)
        shell: pwsh
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'publish/offline'))
          if (-not [IO.File]::Exists((Join-Path $bundleRoot 'bstrings.exe'))) {
            throw 'Complete offline bundle does not have bstrings.exe at its root.'
          }

          ./tools/licenses/Verify-MagikaRedistribution.ps1 `
            -BundleDirectory $bundleRoot
          ./tools/licenses/Verify-FlossThirdPartyNotices.ps1 `
            -FlossExecutable (Join-Path $bundleRoot 'tools/floss/floss.exe') `
            -StagedDirectory $bundleRoot

          ./tools/licenses/Verify-ManagedThirdPartyNotices.ps1 `
            -PublishedDirectory $bundleRoot `
            -CompleteBundle

          $env:HF_DATASETS_OFFLINE = '1'
          $env:HF_HUB_OFFLINE = '1'
          $env:TRANSFORMERS_OFFLINE = '1'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'

          Push-Location $bundleRoot
          try {
            & (Join-Path $bundleRoot 'Verify-AirgapBundle.ps1') `
              -TranslationSmoke `
              -OcrSmoke `
              -OcrSmokeProviders cpu
          }
          finally {
            Pop-Location
          }

          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          }
          else {
            "workflow-$env:GITHUB_RUN_ID"
          }
          $releaseBase = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$releaseTag"
          ./tools/airgap/New-BundlePackRelease.ps1 `
            -BundleDirectory $bundleRoot `
            -OutputDirectory release-packs `
            -ReleaseAssetBaseUrl $releaseBase `
            -CoreReleaseArchive (Join-Path $PWD 'bstrings-win-x64.zip') `
            -InstallerScript (Join-Path $PWD 'Scripts\Install-BstringsQuality.ps1')

          $checksumRows = Get-Content -LiteralPath release-packs/SHA256SUMS.txt
          $expectedChecksumFiles = [Collections.Generic.Dictionary[string, string]]::new(
            [StringComparer]::Ordinal
          )
          $coreArchive = Get-Item -LiteralPath bstrings-win-x64.zip -Force
          if (-not $expectedChecksumFiles.TryAdd($coreArchive.Name, $coreArchive.FullName)) {
            throw "Duplicate public release-asset name: $($coreArchive.Name)"
          }
          foreach ($file in Get-ChildItem -LiteralPath release-packs -File -Force) {
            if ($file.Name -ceq 'SHA256SUMS.txt') {
              continue
            }
            if (-not $expectedChecksumFiles.TryAdd($file.Name, $file.FullName)) {
              throw "Duplicate public release-asset name: $($file.Name)"
            }
          }
          if ($checksumRows.Count -ne $expectedChecksumFiles.Count) {
            throw 'SHA256SUMS.txt does not contain exactly one row per checksummed public release asset.'
          }
          $checkedNames = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($row in $checksumRows) {
            if ($row -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>[^/\\]+)$') {
              throw "Invalid split-pack checksum row: $row"
            }
            $assetPath = $null
            if (-not $expectedChecksumFiles.TryGetValue([string]$Matches.name, [ref]$assetPath)) {
              throw "SHA256SUMS.txt names an unexpected public release asset: $($Matches.name)"
            }
            if (-not $checkedNames.Add([string]$Matches.name)) {
              throw "Duplicate public release-asset checksum row: $($Matches.name)"
            }
            $actual = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches.hash) {
              throw "Public release-asset checksum mismatch: $($Matches.name)"
            }
          }
          if ($checkedNames.Count -ne $expectedChecksumFiles.Count) {
            throw 'SHA256SUMS.txt does not name the exact public release-asset set.'
          }

      - name: Upload complete offline split packs
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.full_offline)
        uses: actions/upload-artifact@v7
        with:
          name: bstrings-win-x64-offline-packs
          path: release-packs/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  profile-acceptance:
    name: Accept the highest-quality offline bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, Windows, X64, bstrings-offline-release]
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    concurrency:
      group: bstrings-offline-profile-acceptance
      cancel-in-progress: false

    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v7

      - name: Download core release package
        uses: actions/download-artifact@v8
        with:
          name: bstrings-win-x64
          path: ${{ runner.temp }}\bstrings-profile-input-${{ github.run_id }}-${{ github.run_attempt }}\core

      - name: Download complete offline split packs
        uses: actions/download-artifact@v8
        with:
          name: bstrings-win-x64-offline-packs
          path: ${{ runner.temp }}\bstrings-profile-input-${{ github.run_id }}-${{ github.run_attempt }}\packs

      - name: Acquire, assemble, verify, and smoke the quality bundle
        shell: pwsh
        timeout-minutes: 330
        run: |
          $ErrorActionPreference = 'Stop'
          $inputRoot = Join-Path $env:RUNNER_TEMP "bstrings-profile-input-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./tools/airgap/Invoke-OfflineProfileAcceptance.ps1 `
            -CoreArchive (Join-Path $inputRoot 'core\bstrings-win-x64.zip') `
            -PackDirectory (Join-Path $inputRoot 'packs') `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "bstrings-profile-work-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "bstrings-profile-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") `
            -SourceBuildRunId $env:GITHUB_RUN_ID `
            -SourceRunAttempt $env:GITHUB_RUN_ATTEMPT `
            -SourceTag $env:GITHUB_REF_NAME `
            -SourceCommit $env:GITHUB_SHA `
            -SourceRepository $env:GITHUB_REPOSITORY

      - name: Upload checked profile-acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: bstrings-offline-profile-acceptance
          path: ${{ runner.temp }}\bstrings-profile-evidence-${{ github.run_id }}-${{ github.run_attempt }}\offline-profile-acceptance.json
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, profile-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v7

      - name: Download core release package
        uses: actions/download-artifact@v8
        with:
          name: bstrings-win-x64
          path: release-assets

      - name: Download complete offline split packs
        uses: actions/download-artifact@v8
        with:
          name: bstrings-win-x64-offline-packs
          path: release-assets

      - name: Download checked profile-acceptance evidence
        uses: actions/download-artifact@v8
        with:
          name: bstrings-offline-profile-acceptance
          path: release-gate-evidence

      - name: Validate checked profile-acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/airgap/Test-OfflineProfileReleaseEvidence.ps1 `
            -EvidencePath release-gate-evidence/offline-profile-acceptance.json `
            -AssetDirectory release-assets `
            -ExpectedRepository $env:GITHUB_REPOSITORY `
            -ExpectedServerUrl $env:GITHUB_SERVER_URL `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommit $env:GITHUB_SHA `
            -ExpectedBuildRunId $env:GITHUB_RUN_ID `
            -ComponentLockPath tools/airgap/offline-components.lock.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # The automatic master workflow stages this tag as a draft. Keeping
          # draft unset here publishes only after every accepted asset uploads.
          name: bstrings ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release-assets/bstrings-win-x64.zip
            release-assets/bstrings-win-x64-offline-base.zip
            release-assets/Install-BstringsQuality.ps1
            release-assets/airgap-config-*.json
            release-assets/airgap-manifest-*.json
            release-assets/Hy-MT2-Apache-2.0-*.txt
            release-assets/bundle-packs-*.json
            release-assets/SHA256SUMS.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true

      - name: Verify the published immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = & gh release view $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,isImmutable,isPrerelease,assets | ConvertFrom-Json
          if (
            $release.tagName -cne $env:GITHUB_REF_NAME -or
            $release.isDraft -or
            -not $release.isImmutable -or
            $release.isPrerelease
          ) {
            throw 'The published complete release identity or state is invalid.'
          }
          $actual = @($release.assets | ForEach-Object { [string]$_.name } | Sort-Object)
          $expected = @(
            'airgap-config-quality.json'
            'airgap-manifest-quality.json'
            'bstrings-win-x64-offline-base.zip'
            'bstrings-win-x64.zip'
            'bundle-packs-quality.json'
            'Hy-MT2-Apache-2.0-quality.txt'
            'Install-BstringsQuality.ps1'
            'SHA256SUMS.txt'
          ) | Sort-Object
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw "Published release asset set mismatch: $($actual -join ', ')"
          }
          Write-Host "Published and verified complete release $env:GITHUB_REF_NAME."
