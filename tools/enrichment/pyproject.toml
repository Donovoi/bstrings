[project]
name = "bstrings-enrichment"
version = "0.1.0"
description = "Optional Magika, FLOSS, and offline translation adapters for bstrings"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
translation = [
    "sentencepiece>=0.2,<1",
    "torch>=2.7,<3",
    "transformers>=4.57,<5",
]
benchmark = [
    "sacrebleu>=2.5,<3",
]
ocr-benchmark = [
    "pyarrow==25.0.0",
    "shapely==2.1.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
